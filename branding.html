<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Branding — Portfolio</title>
    <meta name="description" content="Brand identity and logo design work." />
    <meta name="theme-color" content="#f6f5f2" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23141413'/%3E%3C/svg%3E" />

    <!-- Font (optional): Jost. Falls back to system serif/sans if blocked. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" />

    <!-- All asset paths are RELATIVE so the site works from a GitHub Pages subpath. -->
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>

  <body id="top" data-page="branding">
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>

    <main id="main">
      <div id="list-view">
        <!--
          Intro (edit the copy freely).
          Optional hero image: set data-hero-image to the exact .webp filename in this
          category's image folder. It appears on the right, fading into the page.
        -->
        <section class="hero" id="hero" data-hero-image="" aria-labelledby="page-title">
          <div class="hero__inner container">
            <p class="eyebrow">Branding</p>
            <h1 class="hero__title" id="page-title">Brands with Purpose</h1>
            <p class="hero__intro">
              A collection of brand identities and marks designed to communicate who a brand is, build recognition and create lasting impressions.
            </p>
          </div>
        </section>

        <div class="filters container" id="filters" hidden></div>
        <div class="container" id="projects" aria-live="polite" aria-busy="true"></div>
      </div>
      <!-- A project's dedicated view is rendered here (route: #project/<id>). -->
      <div class="container" id="project-detail" hidden></div>

      <div id="site-cta"></div>
    </main>

    <div id="site-footer"></div>

    <noscript>
      <p style="padding: 24px; text-align: center">This portfolio needs JavaScript to load its projects.</p>
    </noscript>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
