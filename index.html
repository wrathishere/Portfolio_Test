<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joydip Bhattacharya — Selected Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg width="0" height="0"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter></svg>
<div class="grain" style="filter:url(#noise); background:#fff;"></div>

<div class="brand">Joydip Bhattacharya <span>— Selected Works</span></div>
<div class="status" id="status"></div>

<div class="stage" id="stage">
  <div class="stage-loading" id="stageLoading">
    <div class="spinner"></div>
    <div id="loadingText">Loading portfolio…</div>
  </div>
  <div id="bookCanvas"></div>
</div>

<div class="nav">
  <button id="btnPrev" aria-label="Previous page">&#8592;</button>
  <button class="index-btn" id="btnIndex">Cover</button>
  <span class="counter" id="counter">—</span>
  <button id="btnNext" aria-label="Next page">&#8594;</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="js/data.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
